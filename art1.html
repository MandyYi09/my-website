<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Flow Field</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #03030a;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script>

let particles = [];

let flowField = [];

let cols;
let rows;

let scl = 18;

let zOffset = 0;

let particleCount = 1200;


function setup() {

  createCanvas(windowWidth, windowHeight);

  colorMode(HSB, 360, 100, 100, 100);

  background(235, 50, 3);

  cols = floor(width / scl) + 1;
  rows = floor(height / scl) + 1;


  for (let i = 0; i < particleCount; i++) {

    particles.push(new Particle());

  }

}



function draw() {

  // dark transparent layer creates long trails
  background(235, 60, 3, 5);


  createFlowField();


  for (let particle of particles) {

    particle.follow(flowField);

    particle.update();

    particle.edges();

    particle.show();

  }


  zOffset += 0.002;

}



function createFlowField() {

  let yOffset = 0;

  flowField = [];


  for (let y = 0; y < rows; y++) {

    let xOffset = 0;


    for (let x = 0; x < cols; x++) {

      let n = noise(
        xOffset,
        yOffset,
        zOffset
      );


      // stronger turns
      let angle =
        n * TWO_PI * 3;


      // wave distortion
      angle +=
        sin(frameCount * 0.01 + y * 0.15)
        * 0.6;


      let direction =
        p5.Vector.fromAngle(angle);


      direction.setMag(0.12);


      flowField.push(direction);


      xOffset += 0.08;

    }


    yOffset += 0.08;

  }

}



class Particle {

  constructor() {

    this.position = createVector(
      random(width),
      random(height)
    );


    this.previousPosition =
      this.position.copy();


    this.velocity = p5.Vector.random2D();

    this.velocity.mult(
      random(0.5, 2)
    );


    this.acceleration =
      createVector(0, 0);


    this.maxSpeed =
      random(2, 5);


    // neon blue / purple / pink range
    this.hue =
      random(170, 330);


    this.size =
      random(0.5, 2.5);

  }



  follow(vectors) {

    let x =
      floor(this.position.x / scl);

    let y =
      floor(this.position.y / scl);


    x =
      constrain(
        x,
        0,
        cols - 1
      );


    y =
      constrain(
        y,
        0,
        rows - 1
      );


    let index =
      x + y * cols;


    let force =
      vectors[index];


    if (force) {

      this.applyForce(force);

    }



    // mouse creates a second force
    let mouse =
      createVector(
        mouseX,
        mouseY
      );


    let direction =
      p5.Vector.sub(
        mouse,
        this.position
      );


    let distance =
      direction.mag();


    if (distance < 180) {

      direction.normalize();


      let strength =
        map(
          distance,
          0,
          180,
          0.18,
          0
        );


      direction.mult(strength);


      this.applyForce(direction);

    }

  }



  applyForce(force) {

    this.acceleration.add(force);

  }



  update() {

    this.velocity.add(
      this.acceleration
    );


    this.velocity.limit(
      this.maxSpeed
    );


    this.position.add(
      this.velocity
    );


    this.acceleration.mult(0);

  }



  show() {

    // color slowly changes through time
    let changingHue =
      (
        this.hue +
        frameCount * 0.15 +
        this.position.x * 0.03
      ) % 360;


    stroke(
      changingHue,
      80,
      100,
      35
    );


    strokeWeight(
      this.size
    );


    line(
      this.previousPosition.x,
      this.previousPosition.y,
      this.position.x,
      this.position.y
    );


    this.updatePrevious();

  }



  updatePrevious() {

    this.previousPosition.x =
      this.position.x;

    this.previousPosition.y =
      this.position.y;

  }



  edges() {

    if (this.position.x > width) {

      this.position.x = 0;

      this.updatePrevious();

    }


    if (this.position.x < 0) {

      this.position.x = width;

      this.updatePrevious();

    }


    if (this.position.y > height) {

      this.position.y = 0;

      this.updatePrevious();

    }


    if (this.position.y < 0) {

      this.position.y = height;

      this.updatePrevious();

    }

  }

}



function mousePressed() {

  // inject extra particles where clicked

  for (let i = 0; i < 120; i++) {

    let p =
      new Particle();


    p.position =
      createVector(
        mouseX + random(-30, 30),
        mouseY + random(-30, 30)
      );


    p.previousPosition =
      p.position.copy();


    particles.push(p);

  }


  // prevent too many particles
  if (particles.length > 2500) {

    particles.splice(
      0,
      500
    );

  }

}



function keyPressed() {

  // SPACE clears screen
  if (key === " ") {

    background(
      235,
      60,
      3
    );

  }


  // R resets everything
  if (key === "r" || key === "R") {

    particles = [];

    for (
      let i = 0;
      i < particleCount;
      i++
    ) {

      particles.push(
        new Particle()
      );

    }


    noiseSeed(
      floor(random(10000))
    );


    background(
      235,
      60,
      3
    );

  }

}



function windowResized() {

  resizeCanvas(
    windowWidth,
    windowHeight
  );


  cols =
    floor(width / scl) + 1;

  rows =
    floor(height / scl) + 1;


  background(
    235,
    60,
    3
  );

}

</script>

</body>
</html>
